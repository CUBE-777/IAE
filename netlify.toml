# netlify.toml
# إعدادات النشر + رؤوس أمان (Security Headers) على مستوى Netlify.
# المرحلة 1: script-src لم يعد يسمح بـ 'unsafe-inline' ولا بأي CDN (لا يوجد سكربت خارجي في الموقع).
# style-src يحتفظ بـ 'unsafe-inline' لأن React يكتب style="..." في عناصر كثيرة.
# ملاحظة: تم اختيار قيم CSP بعناية لتتطابق مع مشروع Supabase الجديد: vktydqfjybdgxhrjplki.supabase.co

[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback: React Router يتولى التوجيه داخل المتصفح، لذا كل المسارات غير
# الموجودة كملفات فعلية يجب أن تُعاد توجيهها إلى index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(self), payment=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self';
      style-src 'self' https://fonts.googleapis.com 'unsafe-inline';
      font-src 'self' https://fonts.gstatic.com;
      img-src 'self' data: https: blob:;
      connect-src 'self' https://vktydqfjybdgxhrjplki.supabase.co wss://vktydqfjybdgxhrjplki.supabase.co;
      frame-ancestors 'none';
      base-uri 'self';
      form-action 'self';
      object-src 'none';
      frame-src 'none';
      manifest-src 'self';
    """

# لا فهرسة لصفحات لوحة الإدارة عبر محركات البحث (طبقة إضافية فوق noindex meta)
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# بطاقة العضوية الرقمية (0040): صفحة التحقق العامة /verify/:token — الرمز في المسار، فلا فهرسة ولا Referer ولا تخزين.
# (Permissions-Policy: camera=(self) منذ 0041 لماسح الحضور داخل الموقع (صفحة المنظِّم)؛ لا يُسمح بها لأي إطار خارجي.)
[[headers]]
  for = "/verify/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"

# المرحلة 3: ملفات Vite المبنية في /assets/ أسماؤها تحوي hash، فيمكن تخزينها سنة كاملة.
# index.html وtheme-init.js يبقيان بلا تخزين طويل ليصل أي نشر جديد للزوار فورًا.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/theme-init.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# PWA الإدارة: الـ service worker يخدم مساره /admin/ رغم أن ملفه في الجذر، ويجب إعادة التحقق منه دائمًا.
[[headers]]
  for = "/admin-sw.js"
  [headers.values]
    Service-Worker-Allowed = "/admin/"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/admin.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=0, must-revalidate"
