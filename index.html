  <!-- Thème clair/sombre appliqué avant le premier rendu (évite le flash). Clé : iae:theme -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('iae:theme');
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>

<body>
  <div id="root"></div>

  <!--
    نموذج ثابت مخفي لأجل Netlify Forms فقط (لا يُعرض أبدًا للزائر).
    Netlify يكتشف النماذج بفحص HTML الناتج وقت البناء (build-time scan)، ولا يمكنه رؤية
    نموذج يُرسم لاحقًا عبر React/JS. لذلك يجب إبقاء نسخة HTML ثابتة مطابقة تمامًا (نفس
    name وnetlify-honeypot وأسماء الحقول) لنموذج "contact" في features/contact/ContactForm.jsx
    حتى يبقى استقبال رسائل التواصل عبر Netlify Forms يعمل كما في المشروع الأصلي.
    نموذج "membership" لا يحتاج هذا لأنه يُرسل مباشرة إلى Supabase (membership_requests)،
    وليس عبر Netlify Forms (انظر AUDIT_REPORT.md في المشروع الأصلي).
  -->
  <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="contact" />
    <input name="bot-field" />
    <input name="name" />
    <input name="promo" />
    <input name="email" />
    <textarea name="message"></textarea>
  </form>

  <script type="module" src="/src/main.jsx"></script>
</body>
